# Análisis de SonarQube del frontend.
# Uso: npm run test:coverage && npm run sonar -- -Dsonar.host.url=http://localhost:9000 -Dsonar.token=TU_TOKEN
sonar.projectKey=trackit-express-frontend
sonar.projectName=TrackIt Express - Frontend
sonar.projectVersion=2.0.0
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.exclusions=**/*.spec.ts,src/testing/**,src/environments/**,**/*.css
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,src/testing/**

sonar.javascript.lcov.reportPaths=coverage/trackit-express-frontend/lcov.info
sonar.coverage.exclusions=src/main.ts,src/app/app.config.ts,src/environments/**,src/testing/**
